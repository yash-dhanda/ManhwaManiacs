name: manhwamaniacs
description: ManhwaManiacs mobile client — manga/manhwa reader
publish_to: 'none'
version: 3.4.3+56

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State management + DI
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.0.0

  # Networking
  dio: ^5.4.3

  # Chapter audio playback. A real native addition — it brings an iOS pod and
  # an Android ExoPlayer dependency — which is why it lands in its own change:
  # a broken iOS build should be unambiguous about what broke it.
  #
  # It streams the URL rather than buffering the file, because this client
  # holds a bearer token and can set its own headers. The WEB player cannot:
  # mm_session is httpOnly and SameSite=lax, so a browser-managed media
  # request to another origin never carries it, and that player has to fetch
  # the whole file through the JSON client instead. Here the server's Range
  # support does what it was built for, and a seek pulls only what it needs.
  just_audio: ^0.9.40
  # just_audio's own session plugin, already a resolved transitive pod, so
  # promoting it changes zero native build inputs. Direct only so main.dart
  # can declare the narration as SPEECH (see novel_audio_session.dart).
  audio_session: ^0.1.25
  connectivity_plus: ^6.0.5

  # Local storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Image caching
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1

  # App/device info
  package_info_plus: ^8.0.0
  path_provider: ^2.1.3

  # On-device chapter store (1c-M3) — sqflite is already a resolved transitive
  # pod (pulled in by flutter_cache_manager), so promoting it to a direct
  # dependency changes zero native build inputs; see docs/OFFLINE_READING.md
  # and superpowers/specs/2026-09-03-mobile-source-native-design.md §3.
  # `path` and `crypto` are likewise already-resolved transitive packages
  # (path_provider / sqflite depend on them) promoted for the same reason —
  # content-addressed blob paths and their sha256 hashes.
  sqflite: ^2.4.1
  path: ^1.9.0
  crypto: ^3.0.3

  # Logging
  logger: ^2.3.0

  # Utilities
  intl: ^0.19.0
  collection: ^1.18.0

  # Reader — keep screen awake while reading
  wakelock_plus: ^1.2.8

  # Reader — request high refresh-rate display modes on Android
  flutter_displaymode: ^0.6.0

  # External URL launcher (APK update download)
  url_launcher: ^6.3.0

  # Backup & restore — pick a backup file from device storage to upload
  file_picker: ^8.1.2

  # ── Redesign (Cinematic + Glass): native plugins and motion packages ───────
  # Exact pins, no caret. Ledger: docs/redesign/cinematic/DESIGN.md §15.11.
  # flutter_soloud 4.1.7 for BOTH skins: glass §15.11's 5.1.4 needs
  # native_toolchain_c ^0.19.4, which needs meta ^1.19.0, and Flutter 3.44.6
  # pins meta 1.18.0 (revisit with the Flutter upgrade, stack risk 10).
  # share_plus 12.0.2 for both skins: 13.x needs win32 ^6 while
  # package_info_plus 8.x, file_picker 8.x and flutter_secure_storage 9.x pin
  # win32 ^5. phosphor_flutter is NOT added (IconData is a final class in this
  # SDK); liquid_glass_widgets arrives in mobile/03.
  haptic_feedback: 0.6.5
  gaimon: 1.5.0
  flutter_soloud: 4.1.7
  share_plus: 12.0.2
  audio_service: 0.18.19
  sensors_plus: 7.1.0
  flutter_dynamic_icon_plus: 1.4.1
  flutter_animate: 4.5.2
  swipeable_page_route: 0.4.8
  custom_refresh_indicator: 4.0.2
  flutter_reorderable_grid_view: 5.7.0
  liquid_glass_widgets: 1.7.2
  # Glass foundation (mobile/25, ledger glass 15.11). material_color_utilities is
  # the version the Flutter SDK pins (0.13.0 on 3.44.6), never a direct constraint.
  motor: 1.1.0
  heroine: 0.7.2
  smooth_sheets: 1.2.0
  material_color_utilities: any

dev_dependencies:
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8
  flutter_test:
    sdk: flutter

  # Testing
  mocktail: ^1.0.4

  # sqflite on the desktop `flutter test` host has no platform channel, so the
  # on-device store's tests run it against real SQLite via FFI instead — dev
  # only, never ships in the app (no native/pod impact).
  sqflite_common_ffi: ^2.3.3

  # Linting
  flutter_lints: ^4.0.0

  fake_async: any
flutter:
  # ── Darwin dependency management: CocoaPods only ───────────────────────────
  # Swift Package Manager is ON BY DEFAULT on the stable channel
  # (flutter_tools/lib/src/features.dart: swiftPackageManager, stable
  # enabledByDefault: true). Leaving it on is actively harmful here:
  #
  #   * flutter_secure_storage 9.2.4 ships no Package.swift, so CocoaPods would
  #     run ALONGSIDE SwiftPM — the dual-manager mode Flutter itself warns can
  #     produce duplicate-module link failures.
  #   * file_picker's SwiftPM manifest pulls SIX packages straight from GitHub
  #     at build time, three of them tracked by a moving BRANCH
  #     (DKImagePickerController@4.3.9, DKCamera@master, DKPhotoGallery@master).
  #     Nothing in this repo pins them, and CI has no Package.resolved to fall
  #     back on.
  #
  # With SwiftPM off, every plugin resolves through its podspec as a local path
  # pod (see ios/Podfile) — the whole iOS dependency graph is offline and is
  # pinned by pubspec.lock alone. This matters because the iOS build runs on a
  # throwaway cloud Mac nobody can debug interactively.
  #
  # Verified safe: no plugin here is SwiftPM-only, so this cannot trip
  # darwin_dependency_management.dart's `_throwToolExitIfSwiftPMOnlyPluginsExist`.
  config:
    enable-swift-package-manager: false

  uses-material-design: true
  assets:
    - assets/images/
    - assets/haptics/cinematic/
    - assets/haptics/glass/
    - assets/sounds/cinematic/
    - assets/sounds/glass/
    - assets/licenses/
    - assets/gallery/covers/
    - assets/skin_previews/cinematic/
    - assets/skin_previews/glass/
  shaders:
    - lib/skins/cinematic/shaders/grain.frag
  fonts:
    # Syne (display / headings) and DM Sans (body / UI) are bundled as variable
    # fonts so the app NEVER depends on runtime fetching from fonts.gstatic.com.
    # Weights are driven per-style via FontVariation('wght', …) in
    # AppTypography, so a single variable file covers every weight we use.
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
          weight: 700
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
          weight: 400
    # Redesign faces (mobile/03): variable TTFs, weight via FontVariation('wght').
    - family: BodoniModa
      fonts:
        - asset: assets/fonts/BodoniModa.ttf
        - asset: assets/fonts/BodoniModa-Italic.ttf
          style: italic
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
        - asset: assets/fonts/Newsreader-Italic.ttf
          style: italic
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata.ttf
        - asset: assets/fonts/Literata-Italic.ttf
          style: italic
    - family: LiterataMM
      fonts:
        - asset: assets/fonts/Literata.ttf
        - asset: assets/fonts/Literata-Italic.ttf
          style: italic
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4.ttf
        - asset: assets/fonts/SourceSerif4-Italic.ttf
          style: italic
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Italic.ttf
          style: italic
    - family: GoogleSansFlexMM
      fonts:
        - asset: assets/fonts/GoogleSansFlexMM.ttf
    - family: GoogleSansCodeMM
      fonts:
        - asset: assets/fonts/GoogleSansCode.ttf
    - family: CineGlyphs
      fonts:
        - asset: assets/fonts/CineGlyphs.ttf
    - family: GlassGlyphs
      fonts:
        - asset: assets/fonts/GlassGlyphs.ttf
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/phosphor/Phosphor.ttf
    - family: PhosphorThin
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Thin.ttf
    - family: PhosphorLight
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Light.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Bold.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Fill.ttf
    - family: PhosphorDuotone
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Duotone.ttf


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../brand/cinematic/export/icon-ios-1024.png"
  remove_alpha_ios: true
  background_color_ios: "#000000"
  image_path_ios_dark_transparent: "../brand/cinematic/export/icon-ios-dark-1024.png"
  image_path_ios_tinted_grayscale: "../brand/cinematic/export/icon-ios-tinted-1024.png"
  desaturate_tinted_to_grayscale_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "../brand/cinematic/export/android-foreground-1024.png"
  adaptive_icon_monochrome: "../brand/cinematic/export/android-monochrome-1024.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter_native_splash:
  color: "#000000"
  color_dark: "#000000"
  android: true
  ios: true
  web: false
  fullscreen: false
  android_12:
    color: "#000000"
    color_dark: "#000000"
    icon_background_color: "#000000"
    icon_background_color_dark: "#000000"
    image: "../brand/splash/transparent-288.png"
    image_dark: "../brand/splash/transparent-288.png"
