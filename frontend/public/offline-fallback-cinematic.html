* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #000000; color: #F3F0E8; }
body {

main { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
.mark { color: #F3F0E8; display: block; }
.badge { font: 700 11px/16px "Archivo Narrow", "Arial Narrow", "Roboto Condensed", sans-serif; text-transform: uppercase; letter-spacing: 0.16em; }
.badge.off { color: #FF5B4A; }
.badge.on { color: #57D68D; }
h1 { margin: 0; font: italic 400 32px/36px "Bodoni Moda", Didot, "Bodoni 72", "Bodoni MT", Georgia, serif; color: #F3F0E8; }
.deck { margin: 0; font: 400 18px/28px Newsreader, Georgia, serif; color: #9A978F; }
.note { margin: 0; font: 400 12px/16px "IBM Plex Mono", ui-monospace, monospace; color: #9A978F; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; margin-top: 8px; }
button, a.quiet { min-height: 44px; display: inline-flex; align-items: center; font: 600 15px/20px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; cursor: pointer; }
button { border: 0; border-radius: 0; background: #F3F0E8; color: #000000; padding: 0 24px; }
a.quiet { color: #F3F0E8; text-decoration: none; padding: 0 4px; }
a.quiet:hover { text-decoration: underline; text-decoration-thickness: 1px; }
button:focus-visible, a.quiet:focus-visible { outline: 2px solid #F3F0E8; outline-offset: 2px; box-shadow: 0 0 0 6px #000000; }

<script>
  (function () {
    var badge = document.getElementById("badge");
    function sync() {
      var on = navigator.onLine;
      badge.textContent = on ? "BACK ONLINE" : "NO CONNECTION";
      badge.className = "badge " + (on ? "on" : "off");
    }
    addEventListener("online", sync);
    addEventListener("offline", sync);
    sync();
    document.getElementById("retry").addEventListener("click", function () { location.reload(); });
  })();
